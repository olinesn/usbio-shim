name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (build + test client under Wine)
    runs-on: ubuntu-24.04
    # The first run, with no cached packages, can spend 20 minutes on a slow Ubuntu mirror.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      # Wine's packages (~150 MB with the 32-bit side) come from Ubuntu's mirror, which is
      # sometimes very slow (5 min on one run, over 20 on the next). Keep them in the Actions
      # cache; apt then downloads only what changed.
      - name: Cache Ubuntu's packages
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-debs-ubuntu-24.04-
      - name: Install libusb and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev wine wine64 wine32:i386
          sudo apt-get autoclean
          rm -rf "$HOME/apt-debs" && mkdir -p "$HOME/apt-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
          echo "$(ls "$HOME/apt-debs" | wc -l) packages kept for the cache"
          wine --version
      - name: Build the DLL and the helper
        run: ./build.sh
      - name: Build the simulated units and the test client
        run: tests/build-tests.sh
      - name: Stream from two simulated units through the shim
        env:
          WINEDEBUG: -all
        run: |
          export WINEPREFIX="$RUNNER_TEMP/prefix"
          timeout 300 wineboot -i
          MOCK_DEVICES=2 out/usbio-helper-mock -p 47399 >"$RUNNER_TEMP/helper.log" 2>&1 &
          sleep 1
          cd out
          WINEDLLOVERRIDES="powrprof=n,b;winemenubuilder.exe=d" USBIO_SHIM_PORT=47399 \
            timeout 180 wine usbio_client.exe 5 2
      - name: Helper log
        if: always()
        run: cat "$RUNNER_TEMP/helper.log" || true

  macos:
    name: macOS (build)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install libusb
        run: brew install libusb
      - name: Build the DLL and the helper
        run: ./build.sh
      - name: Build the simulated units and the test client
        run: tests/build-tests.sh
